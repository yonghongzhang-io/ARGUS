[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Responsible-AI auditing of causal identification in DID environmental-policy evaluation"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
argus = "argus.cli:main"
argus-audit = "argus.cli:audit_main"
argus-evaluate = "argus.cli:evaluate_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
