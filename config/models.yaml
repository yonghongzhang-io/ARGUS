# Provider-neutral model registry for cross-model robustness runs.
#
# This is READY-TO-RUN INFRASTRUCTURE, not experimental results. Cross-model
# numerical results are NOT reported in the paper. Every model is DISABLED by
# default: enabling one and running the LLM assessor issues PAID API calls (or
# uses local compute). Nothing here calls a model on its own.
#
# To actually run a model you must (1) set enabled: true here, (2) provide the
# provider's credentials in the environment, and (3) run the LLM assessor under
# an explicit, authorized configuration (see experiments/models/plan_run.py for a
# no-API dry-run that only prints the plan and projected cost).
#
# Adding a NEW provider requires implementing a ProviderAdapter (see
# src/argus/agent/model_config.py) and branching it in
# src/argus/pipeline/assessment.py:assess; only the openai adapter (the existing
# make_client path) ships today. gpt-4o remains the single model behind every
# number currently reported.

defaults:
  temperature: 0
  max_tokens: 1024
  max_steps: 1            # bounded-loop budget (kept small on purpose)
  retries: 2
  cost_ceiling_usd: 5.0   # a planned run projected to exceed this aborts (dry-run guard)
  cache: true             # cache identical (prompt, model) calls
  avg_tokens_per_call: 1500   # rough estimate used ONLY for dry-run cost projection

models:
  - id: gpt4o
    provider: openai
    model: gpt-4o
    enabled: false
    price_per_1k_usd: 0.0075   # blended in/out estimate; verify before any real run

  - id: claude_sonnet
    provider: anthropic
    model: claude-sonnet-5
    enabled: false
    price_per_1k_usd: 0.009

  - id: llama_open
    provider: local
    model: llama-3.1-70b-instruct
    enabled: false
    price_per_1k_usd: 0.0    # local/self-hosted; no per-token API cost
