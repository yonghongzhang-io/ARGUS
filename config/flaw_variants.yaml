  target_dimension: specification
  flaw_type: commission
  severity: high
  injection:
    op: replace
    sections:
      specification: Our preferred specification augments the two-way fixed-effects model with a vector
        of time-varying provincial controls - energy consumption per unit of GDP, the output share of
        the regulated high-emitting sectors, and total electricity use - each entered contemporaneously
        for every year of the panel. Because these variables closely track the industrial structure
