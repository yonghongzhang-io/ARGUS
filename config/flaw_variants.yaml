    op: replace
    sections:
      parallel trends: Figure 2 reports event-study estimates in the six years surrounding each province's
        pilot launch, normalized to the year before treatment. The individual lead coefficients are
        estimated imprecisely, but a joint Wald test of the pre-treatment leads returns a p-value of
