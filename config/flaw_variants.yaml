# Multi-variant flaw-injection catalog. Several naturalistic flaw variants
# per identification dimension, extending the base 11-flaw benchmark.
# flaw_type: commission (replace a section with flawed-but-natural prose) or
# omission (remove the supporting evidence). Every variant is leak-free: it
# contains none of the detector's sentinel phrases (enforced by
# tests/test_flaw_variants.py). See experiments/variants/README.md.
variants:
- variant_id: concurrent_policies_commission_01
  target_dimension: concurrent_policies
  flaw_type: commission
  severity: high
  injection:
    op: replace
    sections:
      concurrent policies: The carbon trading pilots were launched during a broad wave of environmental
        policymaking, including the 2013 Air Pollution Prevention and Control Action Plan and the national
        low-carbon city pilot program, both rolled out across many of the same provinces. Because these
        initiatives belonged to the same national reform agenda, we treat them as common macroeconomic
        shocks and absorb them through year fixed effects, which flexibly capture nationwide shifts
        in environmental regulation. The identifying variation therefore comes from the gap between
        pilot and non-pilot provinces net of these common-year effects, which we read as the causal
        contribution of emissions trading. We accordingly attribute the full estimated decline in provincial
        emissions intensity to the carbon market.
  expected:
    clean_risk_max: low
    injected_risk_min: high
  forbidden_leakage_terms:
  - unaddressed co-timed policy
  - unaddressed concurrent policy
  - left unaddressed
  - confounding policy
  - another policy explains
  - is confounded
  - is biased
  - we ignore
  - this violates
- variant_id: concurrent_policies_commission_02
  target_dimension: concurrent_policies
  flaw_type: commission
  severity: medium
  injection:
    op: replace
    sections:
      concurrent policies: Among contemporaneous measures, the most salient is the binding provincial
        energy-intensity target set under the Five-Year Plan, which we control for by adding each province's
        target as a time-varying covariate. Once this term is included, the pilot coefficient is essentially
        unchanged, indicating that our estimate reflects the emissions-trading scheme rather than energy-intensity
        regulation. We therefore adopt the energy-intensity-adjusted specification as our preferred
        model and read the remaining treatment effect as the impact of the carbon market. The other
        environmental measures introduced over the sample were national in scope and are captured by
        the common time controls.
  expected:
    clean_risk_max: low
    injected_risk_min: medium
