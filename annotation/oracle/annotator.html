 body{font-family:-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#22262b}

 .pid{font-weight:700;color:#3e6598}.dim{font-weight:600}

 .row2{display:flex;gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap}
 label{font-size:13px}
 .noev{background:#fbf1e3;padding:6px 10px;border-radius:6px}
 .filter{margin-left:auto}

const KEY = "argus_oracle_v1";
let saved = JSON.parse(localStorage.getItem(KEY) || "{}");
const wrap = document.getElementById("cards");
const papers = [...new Set(ROWS.map(r=>r.paper_id))];
const pf = document.getElementById("paperFilter");
pf.innerHTML = '<option value="">全部论文</option>' + papers.map(p=>`<option>${p}</option>`).join("");
pf.onchange = render;

function rid(r){ return r.paper_id + "|" + r.dimension; }
function isDone(r){ const s = saved[rid(r)]||{};
  return (s.no_evidence==="y") || (s.span1 && s.span1.trim().length>10); }

function render(){
  wrap.innerHTML = "";
  ROWS.filter(r=>!pf.value || r.paper_id===pf.value).forEach(r=>{
    const s = saved[rid(r)] || {};
    const c = document.createElement("div");
    c.className = "card" + (isDone(r) ? " done" : "");
    c.innerHTML = `
     <div class="hd"><span class="pid">${r.paper_id}</span>
       <span class="dim">${r.dimension_name}</span><code>${r.dimension}</code></div>
     <div class="hint"><b>Assumption:</b> ${r.assumption}<br>
       <b>期望证据:</b> ${r.expected_evidence}</div>
     <textarea placeholder="evidence_span_1: 逐字粘贴最相关证据 (1-4句; 表/图贴标题+关键行)">${s.span1||""}</textarea>
     <div class="row2"><label>位置1:
       <select class="loc1"><option value=""></option>
        <option>text</option><option>table</option><option>figure</option>
        <option>footnote</option><option>appendix</option></select></label>
       <input type="text" class="loc1d" placeholder="细节, 如 Section 5.2 / Table 3" value="${s.loc1d||""}">
       <span class="noev"><label><input type="checkbox" class="noev-cb" ${s.no_evidence==="y"?"checked":""}>
        论文中没有该维度的任何证据</label></span></div>
     <textarea class="sp2" placeholder="evidence_span_2 (可选)">${s.span2||""}</textarea>
     <div class="row2"><label>位置2:
       <select class="loc2"><option value=""></option>
        <option>text</option><option>table</option><option>figure</option>
        <option>footnote</option><option>appendix</option></select></label>
       <input type="text" class="notes" placeholder="notes (拿不准写这里)" style="flex:1" value="${s.notes||""}"></div>`;
    const [t1, t2] = c.querySelectorAll("textarea");
    const sel1=c.querySelector(".loc1"), sel2=c.querySelector(".loc2");
    sel1.value=s.loc1||""; sel2.value=s.loc2||"";
    const cb=c.querySelector(".noev-cb"), l1d=c.querySelector(".loc1d"), nt=c.querySelector(".notes");
    function save(){
      saved[rid(r)] = {span1:t1.value, loc1:sel1.value, loc1d:l1d.value,
        span2:t2.value, loc2:sel2.value, no_evidence:cb.checked?"y":"", notes:nt.value};
      localStorage.setItem(KEY, JSON.stringify(saved));
      c.className = "card" + (isDone(r) ? " done" : ""); prog();
    }
    [t1,t2,l1d,nt].forEach(el=>el.addEventListener("input",save));
    [sel1,sel2,cb].forEach(el=>el.addEventListener("change",save));
  });
  prog();
}
function prog(){
  const done = ROWS.filter(isDone).length;
  document.getElementById("prog").textContent = `已完成 ${done} / ${ROWS.length}`;
}
function csvEsc(v){ v=(v||"").replace(/"/g,'""'); return `"${v}"`; }
document.getElementById("export").onclick = ()=>{
  const head = ["paper_id","dimension","dimension_name","assumption","expected_evidence",
    "evidence_span_1","span_1_location","evidence_span_2","span_2_location",
    "no_evidence_in_paper","notes"];
  const lines = [head.join(",")];
  ROWS.forEach(r=>{ const s=saved[rid(r)]||{};
    const loc1 = s.loc1 ? (s.loc1 + (s.loc1d? ": "+s.loc1d : "")) : "";
    lines.push([r.paper_id,r.dimension,r.dimension_name,r.assumption,r.expected_evidence,
      s.span1||"", loc1, s.span2||"", s.loc2||"", s.no_evidence||"", s.notes||""]
      .map(csvEsc).join(","));
  });
  const blob = new Blob(["\ufeff"+lines.join("\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "evidence_spans_filled.csv"; a.click();
};
render();
</script></body></html>
