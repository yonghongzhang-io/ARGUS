<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="980" viewBox="0 0 1840 980" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#2b2b2b"/>
    </marker>
    <linearGradient id="cred" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a9d6a"/>
      <stop offset="45%" stop-color="#cdb24a"/>
      <stop offset="100%" stop-color="#c0473f"/>
    </linearGradient>
  </defs>

  <rect width="1840" height="980" fill="#eceae3"/>

  <!-- Title -->
  <text x="920" y="64" text-anchor="middle" font-size="42" font-weight="700" fill="#1a1a1a">ARGUS: Auditing Causal Identification in Environmental Policy Evaluation</text>
  <text x="920" y="104" text-anchor="middle" font-size="22" fill="#555">Identification credibility varies across assumptions, evidence, and policy context</text>

  <!-- Main container -->
  <rect x="50" y="140" width="1740" height="610" rx="24" fill="#faf9f2" stroke="#d8d5c8" stroke-width="2"/>

  <!-- ================= STAGE 1: INPUT ================= -->
  <g>
    <circle cx="108" cy="196" r="15" fill="#3f5f8f"/>
    <text x="108" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
    <text x="134" y="202" font-size="17" font-weight="700" fill="#3f5f8f" letter-spacing="1">INPUT</text>
  </g>
  <rect x="92" y="350" width="210" height="200" rx="14" fill="#e7edf6" stroke="#aebfd8" stroke-width="2"/>
  <!-- doc icon -->
  <g stroke="#3f5f8f" stroke-width="2.5" fill="none">
    <path d="M170 392 h44 l16 16 v52 h-60 z" fill="#fff"/>
    <path d="M214 392 v16 h16"/>
    <line x1="180" y1="424" x2="222" y2="424"/>
    <line x1="180" y1="436" x2="222" y2="436"/>
    <line x1="180" y1="448" x2="210" y2="448"/>
  </g>
  <text x="197" y="498" text-anchor="middle" font-size="20" font-weight="700" fill="#23364f">Empirical DID study</text>
  <text x="197" y="524" text-anchor="middle" font-size="17" fill="#5a6b82">China ETS pilot</text>

  <line x1="306" y1="450" x2="352" y2="450" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2: DECOMPOSE ================= -->
  <g>
    <circle cx="372" cy="196" r="15" fill="#3f5f8f"/>
    <text x="372" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
    <text x="398" y="202" font-size="17" font-weight="700" fill="#3f5f8f" letter-spacing="1">DECOMPOSE</text>
  </g>
  <rect x="362" y="350" width="250" height="200" rx="14" fill="#f3eef6" stroke="#c9b6d6" stroke-width="2"/>
  <text x="487" y="386" text-anchor="middle" font-size="19" font-weight="700" fill="#4a2f57">Identification assumptions</text>
  <text x="487" y="410" text-anchor="middle" font-size="16" fill="#6b5277">into 11 auditable dimensions</text>
  <text x="380" y="444" font-size="14.5" fill="#444">• parallel trends · no anticipation</text>
  <text x="380" y="468" font-size="14.5" fill="#444">• SUTVA / spillovers · control group</text>
  <text x="380" y="492" font-size="14.5" fill="#444">• staggered timing · inference</text>
  <text x="380" y="516" font-size="14.5" fill="#444">• concurrent policies · placebo · …</text>
  <text x="487" y="540" text-anchor="middle" font-size="13.5" font-style="italic" fill="#8a7397">config/identification_dimensions.yaml</text>

  <line x1="616" y1="450" x2="662" y2="450" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3: AUDIT (per-dimension risk) ================= -->
  <g>
    <circle cx="682" cy="196" r="15" fill="#3f5f8f"/>
    <text x="682" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
    <text x="708" y="202" font-size="17" font-weight="700" fill="#3f5f8f" letter-spacing="1">AUDIT — per-dimension risk, evidence-grounded</text>
  </g>
  <rect x="672" y="240" width="610" height="380" rx="14" fill="#ffffff" stroke="#d8d5c8" stroke-width="2"/>

  <!-- rows: same taxonomy as stage 2, sorted credible -> risky -->
  <!-- row template y centers: 300,366,432,498,564 -->
  <!-- Row 1 supported -->
  <g>
    <text x="694" y="298" font-size="19" font-weight="700" fill="#1a1a1a">Inference</text>
    <text x="694" y="320" font-size="15" fill="#666">province-clustered standard errors</text>
    <rect x="1130" y="284" width="132" height="30" rx="15" fill="#e3f0e8" stroke="#3a9d6a" stroke-width="1.5"/>
    <text x="1196" y="304" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d52">SUPPORTED</text>
  </g>
  <line x1="694" y1="333" x2="1262" y2="333" stroke="#eee" stroke-width="1"/>
  <!-- Row 2 supported -->
  <g>
    <text x="694" y="364" font-size="19" font-weight="700" fill="#1a1a1a">No anticipation</text>
    <text x="694" y="386" font-size="15" fill="#666">announcement ≈ implementation date</text>
    <rect x="1130" y="350" width="132" height="30" rx="15" fill="#e3f0e8" stroke="#3a9d6a" stroke-width="1.5"/>
    <text x="1196" y="370" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d52">SUPPORTED</text>
  </g>
  <line x1="694" y1="399" x2="1262" y2="399" stroke="#eee" stroke-width="1"/>
  <!-- Row 3 medium -->
  <g>
    <text x="694" y="430" font-size="19" font-weight="700" fill="#1a1a1a">Parallel trends</text>
    <text x="694" y="452" font-size="15" fill="#666">pre-trend evidence insufficient</text>
    <rect x="1142" y="416" width="120" height="30" rx="15" fill="#f8ecd9" stroke="#c77d2e" stroke-width="1.5"/>
    <text x="1202" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#b06a1f">FLAGGED · med</text>
  </g>
  <line x1="694" y1="465" x2="1262" y2="465" stroke="#eee" stroke-width="1"/>
  <!-- Row 4 medium -->
  <g>
    <text x="694" y="496" font-size="19" font-weight="700" fill="#1a1a1a">Concurrent policies</text>
    <text x="694" y="518" font-size="15" fill="#666">co-timed policy not ruled out</text>
    <rect x="1142" y="482" width="120" height="30" rx="15" fill="#f8ecd9" stroke="#c77d2e" stroke-width="1.5"/>
    <text x="1202" y="502" text-anchor="middle" font-size="15" font-weight="700" fill="#b06a1f">FLAGGED · med</text>
  </g>
  <line x1="694" y1="531" x2="1262" y2="531" stroke="#eee" stroke-width="1"/>
  <!-- Row 5 high -->
  <g>
    <text x="694" y="562" font-size="19" font-weight="700" fill="#1a1a1a">Control group / SUTVA</text>
    <text x="694" y="584" font-size="15" fill="#666">control contaminated by spillovers</text>
    <rect x="1146" y="548" width="116" height="30" rx="15" fill="#f6e0dd" stroke="#c0473f" stroke-width="1.5"/>
    <text x="1204" y="568" text-anchor="middle" font-size="15" font-weight="700" fill="#b23a32">FLAGGED · high</text>
  </g>

  <!-- credibility axis -->
  <rect x="1300" y="270" width="16" height="320" rx="8" fill="url(#cred)"/>
  <path d="M1308 264 l-8 12 h16 z" fill="#3a9d6a"/>
  <path d="M1308 596 l-8 -12 h16 z" fill="#c0473f"/>
  <text x="1326" y="288" font-size="14.5" font-weight="700" fill="#2e7d52" transform="rotate(0)">more</text>
  <text x="1326" y="306" font-size="14.5" font-weight="700" fill="#2e7d52">credible</text>
  <text x="1326" y="572" font-size="14.5" font-weight="700" fill="#b23a32">higher</text>
  <text x="1326" y="590" font-size="14.5" font-weight="700" fill="#b23a32">risk</text>

  <line x1="1392" y1="430" x2="1440" y2="430" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 4: REPORT -> EXPERT ================= -->
  <g>
    <circle cx="1462" cy="196" r="15" fill="#3f5f8f"/>
    <text x="1462" y="202" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
    <text x="1488" y="202" font-size="17" font-weight="700" fill="#3f5f8f" letter-spacing="1">REPORT</text>
  </g>
  <rect x="1450" y="300" width="300" height="250" rx="14" fill="#eef1f4" stroke="#bcc6d2" stroke-width="2"/>
  <!-- report doc + magnifier -->
  <g stroke="#3f5f8f" stroke-width="2.5" fill="none">
    <path d="M1545 340 h70 v92 h-70 z" fill="#fff"/>
    <line x1="1560" y1="362" x2="1600" y2="362"/>
    <line x1="1560" y1="378" x2="1600" y2="378"/>
    <line x1="1560" y1="394" x2="1588" y2="394"/>
    <circle cx="1610" cy="412" r="20" fill="#fff"/>
    <line x1="1625" y1="427" x2="1642" y2="444"/>
  </g>
  <text x="1600" y="478" text-anchor="middle" font-size="18" font-weight="700" fill="#23364f">Evidence-grounded</text>
  <text x="1600" y="500" text-anchor="middle" font-size="18" font-weight="700" fill="#23364f">audit report</text>
  <!-- expert -->
  <g stroke="#3f5f8f" stroke-width="2.5" fill="none">
    <circle cx="1600" cy="528" r="0.5"/>
  </g>
  <line x1="1600" y1="552" x2="1600" y2="588" stroke="#2b2b2b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g stroke="#3f5f8f" stroke-width="2.5" fill="none">
    <circle cx="1582" cy="606" r="8" fill="#fff"/>
    <path d="M1568 632 a14 12 0 0 1 28 0" fill="#fff"/>
  </g>
  <text x="1612" y="620" font-size="17" font-weight="700" fill="#23364f">Human expert</text>
  <text x="1612" y="640" font-size="14" fill="#5a6b82">(human-in-the-loop)</text>

  <!-- ================= FOOTER ================= -->
  <text x="920" y="792" text-anchor="middle" font-size="18" font-style="italic" fill="#444">Output: (study, identification dimension, risk) triplets with evidence-grounded reports — <tspan font-weight="700" fill="#b23a32">never a verdict on the true causal effect.</tspan></text>

  <g font-size="16" fill="#333">
    <circle cx="120" cy="838" r="5" fill="#3a9d6a"/>
    <text x="135" y="843">decomposes DID identification assumptions</text>
    <circle cx="120" cy="872" r="5" fill="#3a9d6a"/>
    <text x="135" y="877">localizes risk across auditable dimensions</text>
    <circle cx="980" cy="838" r="5" fill="#3a9d6a"/>
    <text x="995" y="843">grounds each flag in tables, figures, text &amp; policy context</text>
    <circle cx="980" cy="872" r="5" fill="#3a9d6a"/>
    <text x="995" y="877">produces human-review reports, not causal-truth verdicts</text>
  </g>
</svg>
