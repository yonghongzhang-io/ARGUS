<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1000" viewBox="0 0 1840 1000" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1840" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#333">ARGUS architecture: a fixed pipeline with bounded agency</text>

  <!-- legend -->
  <rect x="1330" y="36" width="20" height="20" rx="4" fill="#dbe4ee" stroke="#6a8caf" stroke-width="2"/>
  <text x="1358" y="52" font-size="15" fill="#6a8caf">deterministic</text>
  <rect x="1500" y="36" width="20" height="20" rx="4" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2"/>
  <text x="1528" y="52" font-size="15" fill="#5b9e6f">agentic (bounded loop)</text>

  <!-- ============ BAND 1: AUDIT PIPELINE ============ -->
  <text x="60" y="118" font-size="20" font-weight="700" fill="#444" letter-spacing="1">AUDIT PIPELINE  (run per paper)</text>

  <!-- stage boxes: y=170 h=130, center 235 -->
  <!-- 1 decomposition -->
  <rect x="70" y="170" width="215" height="130" rx="12" fill="#dbe4ee" stroke="#6a8caf" stroke-width="2"/>
  <text x="84" y="160" font-size="13" font-weight="700" fill="#6a8caf" letter-spacing="1">DETERMINISTIC</text>
  <text x="177" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#333">decomposition</text>
  <text x="177" y="240" text-anchor="middle" font-size="13.5" fill="#555">map paper onto 11</text>
  <text x="177" y="260" text-anchor="middle" font-size="13.5" fill="#555">identification dimensions</text>

  <!-- 2 extraction (agentic) -->
  <rect x="367" y="170" width="215" height="130" rx="12" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2.5"/>
  <text x="381" y="160" font-size="13" font-weight="700" fill="#5b9e6f" letter-spacing="1">AGENTIC  &#8635;</text>
  <text x="474" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#333">extraction</text>
  <text x="474" y="240" text-anchor="middle" font-size="13.5" fill="#555">gather in-paper</text>
  <text x="474" y="260" text-anchor="middle" font-size="13.5" fill="#555">evidence per dimension</text>

  <!-- 3 assessment (agentic) -->
  <rect x="664" y="170" width="215" height="130" rx="12" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2.5"/>
  <text x="678" y="160" font-size="13" font-weight="700" fill="#5b9e6f" letter-spacing="1">AGENTIC  &#8635;</text>
  <text x="771" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#333">assessment</text>
  <text x="771" y="240" text-anchor="middle" font-size="13.5" fill="#555">score assumption&#8594;</text>
  <text x="771" y="260" text-anchor="middle" font-size="13.5" fill="#555">implication&#8594;evidence</text>

  <!-- 4 localization -->
  <rect x="961" y="170" width="215" height="130" rx="12" fill="#dbe4ee" stroke="#6a8caf" stroke-width="2"/>
  <text x="975" y="160" font-size="13" font-weight="700" fill="#6a8caf" letter-spacing="1">DETERMINISTIC</text>
  <text x="1068" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#333">localization</text>
  <text x="1068" y="240" text-anchor="middle" font-size="13.5" fill="#555">aggregate dimension</text>
  <text x="1068" y="260" text-anchor="middle" font-size="13.5" fill="#555">risks into a risk map</text>

  <!-- 5 report -->
  <rect x="1258" y="170" width="215" height="130" rx="12" fill="#dbe4ee" stroke="#6a8caf" stroke-width="2"/>
  <text x="1272" y="160" font-size="13" font-weight="700" fill="#6a8caf" letter-spacing="1">DETERMINISTIC</text>
  <text x="1365" y="212" text-anchor="middle" font-size="20" font-weight="700" fill="#333">report</text>
  <text x="1365" y="240" text-anchor="middle" font-size="13.5" fill="#555">transparent, evidence-</text>
  <text x="1365" y="260" text-anchor="middle" font-size="13.5" fill="#555">anchored report</text>

  <!-- human expert -->
  <rect x="1555" y="185" width="215" height="100" rx="12" fill="#e6ddf0" stroke="#8f7bb0" stroke-width="2"/>
  <text x="1662" y="225" text-anchor="middle" font-size="19" font-weight="700" fill="#333">human expert</text>
  <text x="1662" y="252" text-anchor="middle" font-size="13.5" fill="#555">reviews &amp; adjudicates</text>

  <!-- arrows band1 -->
  <line x1="285" y1="235" x2="365" y2="235" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="582" y1="235" x2="662" y2="235" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="879" y1="235" x2="959" y2="235" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="1176" y1="235" x2="1256" y2="235" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="1473" y1="235" x2="1553" y2="235" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- bounded-loop callout under the two agentic stages -->
  <line x1="474" y1="300" x2="474" y2="340" stroke="#5b9e6f" stroke-width="2"/>
  <line x1="771" y1="300" x2="771" y2="340" stroke="#5b9e6f" stroke-width="2"/>
  <rect x="367" y="340" width="512" height="92" rx="12" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="623" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#333">bounded ReAct loop</text>
  <text x="623" y="392" text-anchor="middle" font-size="13.5" fill="#555">fixed tools: evidence_search &#183; figure_parse &#183; policy_lookup</text>
  <text x="623" y="414" text-anchor="middle" font-size="13.5" fill="#555">hard step budget (max_steps)  &#183;  logged trace &#8594; results/traces/</text>

  <text x="60" y="470" font-size="14.5" font-style="italic" fill="#777">Control flow is code, not a model decision. Agency is confined to the two green stages.</text>

  <!-- divider -->
  <line x1="60" y1="510" x2="1780" y2="510" stroke="#e2ded2" stroke-width="2"/>

  <!-- ============ BAND 2: FLAW-INJECTION EVALUATION LOOP ============ -->
  <text x="60" y="565" font-size="20" font-weight="700" fill="#444" letter-spacing="1">FLAW-INJECTION EVALUATION LOOP  (validates ARGUS)</text>

  <!-- credible paper -->
  <rect x="70" y="650" width="180" height="100" rx="12" fill="#f0efe9" stroke="#9aa0a6" stroke-width="2"/>
  <text x="160" y="692" text-anchor="middle" font-size="17" font-weight="700" fill="#333">credible</text>
  <text x="160" y="715" text-anchor="middle" font-size="17" font-weight="700" fill="#333">DID paper</text>

  <line x1="250" y1="700" x2="320" y2="700" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- injection -->
  <rect x="320" y="640" width="250" height="120" rx="12" fill="#f6e7cf" stroke="#cc9a5c" stroke-width="2"/>
  <text x="445" y="678" text-anchor="middle" font-size="18" font-weight="700" fill="#333">injection</text>
  <text x="445" y="704" text-anchor="middle" font-size="13.5" fill="#555">inject ONE known flaw</text>
  <text x="445" y="724" text-anchor="middle" font-size="13.5" fill="#555">on a target dimension</text>
  <text x="445" y="746" text-anchor="middle" font-size="12.5" font-style="italic" fill="#555">config/flaw_taxonomy.yaml</text>

  <!-- split to clean / injected -->
  <path d="M570 680 H610 V628 H700" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M570 720 H610 V772 H700" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="700" y="600" width="180" height="56" rx="10" fill="#dbe4ee" stroke="#6a8caf" stroke-width="2"/>
  <text x="790" y="635" text-anchor="middle" font-size="16" font-weight="700" fill="#333">clean version</text>
  <rect x="700" y="744" width="180" height="56" rx="10" fill="#f1ddda" stroke="#c4615c" stroke-width="2"/>
  <text x="790" y="779" text-anchor="middle" font-size="16" font-weight="700" fill="#333">injected version</text>

  <!-- to audits -->
  <line x1="880" y1="628" x2="950" y2="628" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="880" y1="772" x2="950" y2="772" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <rect x="950" y="600" width="200" height="56" rx="10" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2"/>
  <text x="1050" y="628" text-anchor="middle" font-size="15" font-weight="700" fill="#333">ARGUS audit</text>
  <text x="1050" y="646" text-anchor="middle" font-size="11.5" fill="#555">(pipeline above)</text>
  <rect x="950" y="744" width="200" height="56" rx="10" fill="#dcebd9" stroke="#5b9e6f" stroke-width="2"/>
  <text x="1050" y="772" text-anchor="middle" font-size="15" font-weight="700" fill="#333">ARGUS audit</text>
  <text x="1050" y="790" text-anchor="middle" font-size="11.5" fill="#555">(pipeline above)</text>

  <!-- merge to evaluation -->
  <path d="M1150 628 H1200 V690 H1255" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M1150 772 H1200 V710 H1255" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- evaluation -->
  <rect x="1255" y="630" width="270" height="140" rx="12" fill="#f0efe9" stroke="#9aa0a6" stroke-width="2.5"/>
  <text x="1390" y="666" text-anchor="middle" font-size="18" font-weight="700" fill="#333">evaluation</text>
  <text x="1270" y="698" font-size="14" fill="#5b9e6f">&#9679;</text><text x="1290" y="698" font-size="14" fill="#333">detection_rate</text>
  <text x="1270" y="724" font-size="14" fill="#c4615c">&#9679;</text><text x="1290" y="724" font-size="14" fill="#333">false_alarm_rate</text>
  <text x="1270" y="750" font-size="14" fill="#6a8caf">&#9679;</text><text x="1290" y="750" font-size="14" fill="#333">localization_acc</text>

  <!-- ground-truth note -->
  <rect x="1255" y="800" width="270" height="64" rx="10" fill="#f1ddda" stroke="#c4615c" stroke-width="1.5"/>
  <text x="1390" y="828" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c4615c">local ground truth = injected flaw,</text>
  <text x="1390" y="848" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c4615c">NOT the true causal effect</text>
</svg>
